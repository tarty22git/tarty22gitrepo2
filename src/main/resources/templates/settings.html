<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - System Settings'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #1e293b; color: #fff; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: 12px 20px; border-radius: 6px; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 style-sidebar" style="width: 260px;">
        <h4 class="fw-bold px-3 py-2 text-primary" th:text="${appName}">CTH App</h4>
        <hr class="text-secondary">
        <ul class="nav flex-column gap-1">
            <li><a href="/"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
            <li><a href="/reconcile"><i class="bi bi-file-earmark-diff me-2"></i> Compare CSV / Excel</a></li>
            <li><a href="/reports"><i class="bi bi-bar-chart me-2"></i> Dynamic Reports</a></li>
            <li><a href="/users"><i class="bi bi-people me-2"></i> User Management</a></li>
            <li><a href="/settings" class="active"><i class="bi bi-gear me-2"></i> App Settings</a></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold text-dark mb-4">Application Global Configuration</h2>

        <div th:if="${success}" class="alert alert-success p-3 mb-4" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger p-3 mb-4" th:text="${error}"></div>

        <div class="card border-0 shadow-sm p-4">
            <form th:action="@{/settings/update}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Application Title / Name (Configurable)</label>
                    <input type="text" name="appName" class="form-control" th:value="${appNameVal}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Authentication Engine</label>
                    <select name="authMode" class="form-select">
                        <option value="DB" th:selected="${authMode == 'DB'}">Local Database Authentication</option>
                        <option value="LDAP" th:selected="${authMode == 'LDAP'}">LDAP / Active Directory Authentication</option>
                    </select>
                </div>

                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="twoFaEnabled" value="true" id="2faSwitch" th:checked="${twoFaEnabled}">
                    <label class="form-check-label fw-semibold" for="2faSwitch">Enable SMS / Email 2FA Authentication OTP (Demo Switch)</label>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password Expiration (Days)</label>
                    <input type="number" name="passwordExpiryDays" class="form-control" th:value="${passwordExpiryDays}">
                </div>

                <button type="submit" class="btn btn-primary px-4 py-2"><i class="bi bi-save me-1"></i> Save Configuration</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
