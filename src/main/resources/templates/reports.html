<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - Dynamic Reports'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #1e293b; color: #fff; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: 12px 20px; border-radius: 6px; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 style-sidebar" style="width: 260px;">
        <h4 class="fw-bold px-3 py-2 text-primary" th:text="${appName}">CTH App</h4>
        <hr class="text-secondary">
        <ul class="nav flex-column gap-1">
            <li><a href="/"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
            <li><a href="/reconcile"><i class="bi bi-file-earmark-diff me-2"></i> Compare CSV / Excel</a></li>
            <li><a href="/reports" class="active"><i class="bi bi-bar-chart me-2"></i> Dynamic Reports</a></li>
            <li><a href="/users"><i class="bi bi-people me-2"></i> User Management</a></li>
            <li><a href="/settings"><i class="bi bi-gear me-2"></i> App Settings</a></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <h2 class="fw-bold text-dark mb-4">Configurable Online Report & Query Builder</h2>

        <div class="card border-0 shadow-sm p-4 mb-4">
            <h5 class="fw-bold text-primary mb-3">Query Configuration</h5>
            <form th:action="@{/reports/generate}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Select Table</label>
                        <select name="tableName" id="tableNameSelect" class="form-select" required onchange="loadColumns()">
                            <option value="">-- Choose Table --</option>
                            <option th:each="t : ${tables}" th:value="${t}" th:text="${t}" th:selected="${t == selectedTable}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Filter Condition (WHERE clause)</label>
                        <input type="text" name="filterCondition" class="form-control" placeholder="e.g. ENABLED = 'Y' or ROLE = 'ROLE_ADMIN'">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Max Records</label>
                        <input type="number" name="limit" class="form-control" value="100" min="1" max="1000">
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-search me-1"></i> Execute Report</button>
                </div>
            </form>
        </div>

        <div th:if="${error}" class="alert alert-danger p-3 mb-4" th:text="${error}"></div>

        <!-- Report Output Table -->
        <div th:if="${rows != null}" class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold">Report Results (<span th:text="${totalCount}"></span> rows)</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th th:each="h : ${headers}" th:text="${h}">Column</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${rows}">
                            <td th:each="entry : ${row.entrySet()}" th:text="${entry.value}">Value</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rows)}">
                            <td th:colspan="${headers != null ? headers.size() : 1}" class="text-center text-muted">No records found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
