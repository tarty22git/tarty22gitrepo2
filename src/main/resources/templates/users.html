<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName} + ' - User Management'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #1e293b; color: #fff; }
        .sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: 12px 20px; border-radius: 6px; }
        .sidebar a:hover, .sidebar a.active { background: #334155; color: #fff; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar p-3 style-sidebar" style="width: 260px;">
        <h4 class="fw-bold px-3 py-2 text-primary" th:text="${appName}">CTH App</h4>
        <hr class="text-secondary">
        <ul class="nav flex-column gap-1">
            <li><a href="/"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
            <li><a href="/reconcile"><i class="bi bi-file-earmark-diff me-2"></i> Compare CSV / Excel</a></li>
            <li><a href="/reports"><i class="bi bi-bar-chart me-2"></i> Dynamic Reports</a></li>
            <li><a href="/users" class="active"><i class="bi bi-people me-2"></i> User Management</a></li>
            <li><a href="/settings"><i class="bi bi-gear me-2"></i> App Settings</a></li>
        </ul>
    </div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">User Account Maintenance</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createUserModal"><i class="bi bi-person-plus me-1"></i> Add New User</button>
        </div>

        <div th:if="${success}" class="alert alert-success p-3" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger p-3" th:text="${error}"></div>

        <div class="card border-0 shadow-sm p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td class="fw-bold" th:text="${user.username}">admin</td>
                            <td th:text="${user.email}">admin@cth.com</td>
                            <td th:text="${user.phoneNumber}">+123456</td>
                            <td><span class="badge bg-secondary" th:text="${user.role}">ROLE_ADMIN</span></td>
                            <td>
                                <span class="badge bg-success" th:if="${!user.locked && user.enabled}">ACTIVE</span>
                                <span class="badge bg-danger" th:if="${user.locked}">LOCKED</span>
                            </td>
                            <td>
                                <form th:action="@{'/users/' + ${user.id} + '/toggle-lock'}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-warning" th:text="${user.locked ? 'Unlock' : 'Lock'}">Lock</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="createUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/users/create}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Create User Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phoneNumber" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password (Default: Qwerty123$)</label>
                        <input type="password" name="password" class="form-control" value="Qwerty123$">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="ROLE_USER">ROLE_USER</option>
                            <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
